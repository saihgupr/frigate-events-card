blueprint:
  name: Frigate Mobile Notifications with Temporary False-Positive Mask Actions
  description: >
    Sends actionable notifications with a snapshot thumbnail and 1-tap "Temporary Mask" / "Mask 8h" action buttons to automatically create a temporary mask in Frigate and eliminate false alarms.
  domain: automation
  input:
    notify_device:
      name: Notification Device
      description: Mobile app device to send the actionable push notification.
      selector:
        device:
          integration: mobile_app
    camera_name:
      name: Frigate Camera (Optional)
      description: Restrict notifications to a specific Frigate camera (e.g. driveway). Leave empty for all cameras.
      default: ""
      selector:
        text:

trigger:
  - id: frigate_event
    platform: mqtt
    topic: frigate/events
    payload: new
    value_template: "{{ value_json.type }}"
  - id: mask_action
    platform: event
    event_type: mobile_app_notification_action
  - id: mask_action
    platform: event
    event_type: ios.notification_action_fired
    event_data:
      actionName: TEMP_MASK_24H
  - id: mask_action
    platform: event
    event_type: ios.notification_action_fired
    event_data:
      actionName: TEMP_MASK_8H

condition: []

action:
  - choose:
      - conditions:
          - condition: trigger
            id: frigate_event
          - condition: template
            value_template: >
              {{ camera_name == '' or trigger.payload_json['after']['camera'] == camera_name }}
        sequence:
          - domain: mobile_app
            type: notify
            device_id: !input notify_device
            title: "{{ trigger.payload_json['after']['label'] | title }} detected"
            message: "Motion on {{ trigger.payload_json['after']['camera'] | replace('_', ' ') | title }}"
            data:
              image: "/api/frigate/notifications/{{ trigger.payload_json['after']['id'] }}/thumbnail.jpg"
              tag: "{{ trigger.payload_json['after']['id'] }}"
              actions:
                - action: "TEMP_MASK_24H"
                  title: "Temporary Mask"
                  action_data:
                    event_id: "{{ trigger.payload_json['after']['id'] }}"
                    camera: "{{ trigger.payload_json['after']['camera'] }}"
                    label: "{{ trigger.payload_json['after']['label'] }}"
                - action: "TEMP_MASK_8H"
                  title: "Mask 8h"
                  action_data:
                    event_id: "{{ trigger.payload_json['after']['id'] }}"
                    camera: "{{ trigger.payload_json['after']['camera'] }}"
                    label: "{{ trigger.payload_json['after']['label'] }}"
                - action: "URI"
                  title: "View Live"
                  uri: "/lovelace/cameras"

      - conditions:
          - condition: trigger
            id: mask_action
          - condition: template
            value_template: >
              {{ (trigger.event.data.action | default(trigger.event.data.actionName, true)) in ['TEMP_MASK_24H', 'TEMP_MASK_8H'] }}
        sequence:
          - service: frigate_temp_mask.add_mask
            data:
              event_id: >
                {% set d = trigger.event.data %}
                {% set ad = d.action_data if d.action_data is defined else none %}
                {% if ad is mapping and ad.event_id %}{{ ad.event_id }}
                {% elif ad is string and ad %}{{ ad }}
                {% elif d.event_id is defined and d.event_id %}{{ d.event_id }}
                {% elif d.data is defined and d.data is mapping and d.data.event_id is defined and d.data.event_id %}{{ d.data.event_id }}
                {% else %}{{ d.tag | default('', true) }}{% endif %}
              duration_hours: >
                {% if (trigger.event.data.action | default(trigger.event.data.actionName, true)) == 'TEMP_MASK_8H' %}8{% else %}24{% endif %}
