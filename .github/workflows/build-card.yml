name: Build and validate Frigate Events Plus

on:
  push:
    branches:
      - feature/auto-hide-reviewed-events
    paths:
      - "src/**"
      - "custom_components/**"
      - "package.json"
      - "package-lock.json"
      - "rollup.config.js"
      - "tsconfig.json"
      - ".github/workflows/build-card.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check TypeScript
        run: npm run typecheck
      - name: Build browser bundle
        run: npm run build
      - name: Check companion integration Python syntax
        run: python -m compileall -q custom_components/frigate_temp_mask
      - name: Commit generated browser bundle
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const path = 'frigate-events-card.js';
            const content = fs.readFileSync(path, 'utf8');
            const existing = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
            if (Array.isArray(existing.data) || existing.data.type !== 'file') {
              throw new Error('Could not read the existing browser bundle.');
            }
            const currentContent = Buffer.from(existing.data.content, 'base64').toString('utf8');
            if (currentContent === content) {
              core.info('Browser bundle is already up to date.');
              return;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: 'build: regenerate Frigate Events Plus bundle [skip ci]',
              content: Buffer.from(content, 'utf8').toString('base64'),
              sha: existing.data.sha,
              branch,
            });
